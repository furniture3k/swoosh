name: Release

# Push a tag like v1.0.0 to build the DMG and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test, build and package
        run: Scripts/make-dmg.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

      - name: Keep the DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swoosh-dmg
          path: dist/*.dmg
